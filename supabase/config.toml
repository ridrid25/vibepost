[functions.telegram-webhook]
verify_jwt = false

[functions.ingest-video]
verify_jwt = false

# TikTok redirects the browser here and cannot attach a Supabase JWT. Security
# is provided by a short-lived, one-time, hashed OAuth state.
[functions.tiktok-oauth-callback]
verify_jwt = false

[functions.tiktok-oauth-start]
verify_jwt = true

[functions.tiktok-sync]
verify_jwt = true

[functions.tiktok-disconnect]
verify_jwt = true

[functions.content-brigade]
verify_jwt = false

# Meeting Assistant authenticates with a dedicated >=32-byte directional
# secret. It intentionally has no Supabase user JWT.
[functions.validate-telegram-attribution]
verify_jwt = false

# POST-13C uses Telegram's webhook secret header plus a fail-closed singleton
# runtime state. It does not accept a Supabase JWT on webhook/activation routes.
[functions.content-factory-leads-canary]
verify_jwt = false

[functions.activate-content-factory-leads-cta]
verify_jwt = true

[functions.rollback-content-factory-leads-canary]
verify_jwt = true

[functions.content-factory-leads-canary-retry-control]
verify_jwt = true
